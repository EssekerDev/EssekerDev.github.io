name: publish glass

on:
  push:
    paths:
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Copy the glass from the public repo
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/EssekerDev/claudedesk-board/main
          for f in index.html app.css app.js desk.js desk.wasm; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$base/$f" -o "$f"
          done
          echo "daeb42e37d1afcc24f82a7f3f9c27a387e14bab2  desk.wasm" | sha1sum -c -
          test "$(wc -c < desk.wasm)" -eq 132989
          printf '\n' > .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css app.js desk.js desk.wasm .nojekyll
          git commit -m "Publish the board glass"
          git push
