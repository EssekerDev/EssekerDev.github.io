name: publish glass

on:
  push:
    paths:
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Copy the glass from the public repo
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/EssekerDev/claudedesk-board/ec94e18230c03ee3a711a67b4af633b33c70206d
          for f in index.html app.css app.js desk.js desk.wasm; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$base/$f" -o "$f"
          done
          echo "4fdb5d46195100165039515ce106b793fda2340f  desk.wasm" | sha1sum -c -
          test "$(wc -c < desk.wasm)" -eq 116640
          python3 - << 'PY'
          css = open("app.css").read()
          i = css.find("#glass")
          block = css[i:css.find("}", i)]
          assert "border-radius" not in block, block
          assert "aspect-ratio" in block
          PY
          printf '\n' > .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css app.js desk.js desk.wasm .nojekyll
          git diff --cached --quiet && exit 0
          git commit -m "Publish the three-band glass"
          git push
